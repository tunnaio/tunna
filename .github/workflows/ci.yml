name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # The race detector needs cgo and a C toolchain, which the Linux runner
      # has and the maintainer's Windows machine does not. This is the one
      # place the memory stores' locking is checked mechanically.
      - name: go test (race)
        if: runner.os == 'Linux'
        run: go test -race ./...

      # Windows runs without the race detector but exercises the
      # platform-specific code paths: share-delete opens, fsync through a
      # read-write handle, CRLF-free sources.
      - name: go test
        if: runner.os == 'Windows'
        run: go test ./...

      - name: spec files parse
        if: runner.os == 'Linux'
        shell: bash
        run: |
          for f in $(find spec -name '*.json'); do
            python3 -c "import json,sys; json.load(open(sys.argv[1], encoding='utf-8'))" "$f" || { echo "invalid JSON: $f"; exit 1; }
          done
          echo "all spec JSON parses"

  sdk-typescript:
    name: sdk/typescript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v7

      # Go is needed by the conformance test, which builds and spawns
      # cmd/tunna-fixtures (ADR-0010).
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: bun install
        run: bun install --frozen-lockfile

      # The generated error table must match spec/errors.json exactly.
      - name: generated files are current
        run: |
          bun run gen
          git diff --exit-code -- src/errors.generated.ts

      - name: type check
        run: bun run check

      # Warm the Go build cache so the conformance test's own build of
      # cmd/tunna-fixtures is fast; the test builds into a temp dir itself.
      - name: warm the fixture server build
        working-directory: .
        run: go build -o /dev/null ./cmd/tunna-fixtures

      - name: bun test
        run: bun test

      # Plain Node, both module formats: the package uses platform APIs only
      # and neither entry depends on Bun.
      - name: node smoke (esm and cjs)
        run: bun run smoke

  benchmarks-compile:
    name: benchmark module compiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: docs/benchmarks/sqlite-driver/go.mod
          cache: true
      - name: vet the driver benchmark module
        working-directory: docs/benchmarks/sqlite-driver
        run: go vet ./...
