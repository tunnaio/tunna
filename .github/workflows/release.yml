name: release

# A tag v<semver> releases the server (ADR-0012): binaries for five
# platforms with checksums attached to a GitHub release, and the image
# pushed to ghcr.io/tunnaio/tunna for amd64 and arm64, all from that
# commit, with build provenance attested. No secret: GHCR takes the
# repository's own token. The maintainer creates the tag; nothing here
# bumps or tags.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  IMAGE: ghcr.io/tunnaio/tunna

jobs:
  version:
    name: version from tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - id: v
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "tag $GITHUB_REF_NAME is not v<semver>"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

  test:
    name: test the tagged commit
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test -race ./...

  binaries:
    name: binaries
    needs: [version, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: build
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}"; arch="${target#*/}"
            out="dist/tunna_${VERSION}_${os}_${arch}"
            [ "$os" = windows ] && out="$out.exe"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o "$out" ./cmd/tunna
          done
          (cd dist && sha256sum * > checksums.txt && cat checksums.txt)

      - name: attest
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/tunna_*

      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/

  image:
    name: image
    needs: [version, test]
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: tags
        id: tags
        env:
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          tags="$IMAGE:$VERSION"
          if [ "$PRERELEASE" = true ]; then tags="$tags,$IMAGE:alpha"; else tags="$tags,$IMAGE:latest"; fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - name: build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: VERSION=${{ needs.version.outputs.version }}
          provenance: false

      - name: attest
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  release:
    name: github release
    needs: [version, binaries, image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: binaries
          path: dist
      - name: create
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          flag=""; [ "$PRERELEASE" = true ] && flag="--prerelease"
          notes=$(printf 'Image: `%s:%s`\nDigest: `%s`\n\nVerify a binary or the image with `gh attestation verify <file-or-oci-ref> --owner tunnaio`.' "$IMAGE" "$VERSION" "$DIGEST")
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "tunna $VERSION" --generate-notes --notes "$notes" $flag dist/*
