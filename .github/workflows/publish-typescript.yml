name: publish sdk/typescript

# A tag sdk/typescript/v<version> stages that version on npm with
# provenance, authenticated by npm trusted publishing (OIDC), so no token
# exists anywhere (ADR-0011). The maintainer creates the tag, and approves
# the staged version on npmjs.com with 2FA; nothing here bumps, tags or
# makes a version public.

on:
  push:
    tags: ["sdk/typescript/v*"]

permissions:
  contents: write   # the GitHub release
  id-token: write   # the OIDC token npm trusts

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Staged publishing (npm stage) is newer than the npm Node 24 ships.
      - name: current npm
        run: npm install -g npm@latest && npm --version

      - name: the tag names the version in package.json
        run: |
          tag="${GITHUB_REF_NAME#sdk/typescript/v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "tag is $tag but package.json says $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          case "$version" in
            *-*) echo "DIST_TAG=alpha" >> "$GITHUB_ENV" ;;
            *)   echo "DIST_TAG=latest" >> "$GITHUB_ENV" ;;
          esac

      - name: bun install
        run: bun install --frozen-lockfile

      - name: generated files are current
        run: |
          bun run gen
          git diff --exit-code -- src/errors.generated.ts

      - name: check, test, build, smoke
        run: |
          bun run check
          bun test
          bun run smoke

      # Staged, not published: the maintainer approves it on npmjs.com.
      - name: npm stage publish
        run: npm stage publish --provenance --access public --tag "$DIST_TAG"

      - name: github release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --title "sdk/typescript $VERSION" --generate-notes $prerelease
          echo "staged on npm as tunna@$VERSION; approve it at https://www.npmjs.com/package/tunna/access" >> "$GITHUB_STEP_SUMMARY"
